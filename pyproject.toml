[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yt-tools"
version = "0.1.6"
description = "CLI wrap for iterative YouTube watching by LLM agents — transcript + targeted frame extraction"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "vitya" }]
dependencies = [
    "youtube-transcript-api>=1.0.0",
    "yt-dlp>=2025.0.0",
    "scenedetect[opencv]>=0.6.4",
]

[project.scripts]
yt-transcript = "yt_tools.transcript:main"
yt-frames = "yt_tools.frames:main"
yt-watch = "yt_tools.watch:main"
yt-tools = "yt_tools.cli:main"

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["yt_tools"]
