[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yt-tools"
version = "0.2.0"
description = "CLI wrap for iterative YouTube watching by LLM agents — transcript + targeted frame extraction"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "vitya" }]
dependencies = [
    "youtube-transcript-api>=1.0.0",
    "yt-dlp>=2025.0.0",
    "scenedetect[opencv]>=0.6.4",
    "librosa>=0.11.0",
    "matplotlib>=3.8",
    "bpm-detector @ git+https://github.com/libraz/bpm-detector@v1.1.0",
]

[project.scripts]
yt-transcript = "yt_tools.transcript:main"
yt-frames = "yt_tools.frames:main"
yt-watch = "yt_tools.watch:main"
yt-listen = "yt_tools.listen:main"
yt-tools = "yt_tools.cli:main"

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["yt_tools"]
